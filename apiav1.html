<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.P.IAv1</title>
<link rel="manifest" href="apiav1.webmanifest">
<link rel="icon" href="apiav1-192.png">
<meta name="theme-color" content="#03070d">
<style>
:root{
  --theme:#00c8ff; --violet:#8b5cf6; --bg:#03070d; --panel:rgba(6,18,30,.78);
  --line:rgba(0,200,255,.22); --text:#d9f4ff; --muted:#6f8aa0; --ok:#10b981; --err:#ff5547;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#0a2238 0%,var(--bg) 62%) fixed;background-color:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,200,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.035) 1px,transparent 1px);background-size:40px 40px}

/* ---------- Ecrãs de arranque ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:var(--bg);transition:opacity .7s ease;padding:16px;text-align:center}
#boot{z-index:51} #activate{z-index:50}
.screen.hide{opacity:0;pointer-events:none}
.gtitle{font-family:var(--mono);font-weight:800;letter-spacing:.35em;padding-left:.35em;font-size:clamp(30px,9vw,104px);margin:0;
  background:linear-gradient(90deg,var(--theme),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(0,200,255,.35))}
.ghr{width:min(520px,80vw);height:2px;border:0;margin:0;background:linear-gradient(90deg,transparent,var(--theme),var(--violet),transparent)}
.blink{font-family:var(--mono);letter-spacing:.3em;font-size:13px;color:var(--theme);animation:blink 1s steps(2) infinite}
.ver{font-family:var(--mono);font-size:11px;letter-spacing:.25em;color:var(--muted)}
@keyframes blink{50%{opacity:.15}}
.btn-activate{font-family:var(--mono);font-size:18px;letter-spacing:.2em;color:var(--theme);background:rgba(0,200,255,.06);
  border:1px solid var(--theme);padding:16px 34px;border-radius:4px;cursor:pointer;transition:.2s;
  box-shadow:0 0 24px rgba(0,200,255,.25),inset 0 0 18px rgba(0,200,255,.12)}
.btn-activate:hover{background:rgba(0,200,255,.16);box-shadow:0 0 40px rgba(0,200,255,.5)}

/* ---------- App ---------- */
#app{position:relative;z-index:1;opacity:0;transition:opacity .8s;max-width:1100px;margin:0 auto;padding:12px 16px 40px}
#app.show{opacity:1}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-family:var(--mono);font-size:12px}
.keybox{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.keybox span{color:var(--muted);letter-spacing:.15em;white-space:nowrap}
input,select,textarea{background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--text);border-radius:4px;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--theme);box-shadow:0 0 0 2px rgba(0,200,255,.15)}
.keybox input{flex:1;min-width:0;padding:8px 10px;font-family:var(--mono);font-size:12px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:20px;color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(16,185,129,.45)}

.hero{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px}
.orb{position:relative;width:200px;height:200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.orb .core{position:absolute;inset:52px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#fff 0%,#c4f5ff 12%,var(--theme) 40%,rgba(0,90,160,.65) 72%,rgba(0,40,80,.2) 100%);
  box-shadow:0 0 40px var(--theme),0 0 90px rgba(0,200,255,.35),inset 0 0 20px rgba(255,255,255,.5);
  animation:pulse 3.4s ease-in-out infinite}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0,200,255,.45);opacity:0;pointer-events:none}
.orb .ring.s1{inset:30px;opacity:1;border:1px dashed rgba(0,200,255,.5);animation:spin 18s linear infinite}
.orb .ring.s2{inset:14px;opacity:1;border:1px solid rgba(139,92,246,.45);border-left-color:transparent;border-right-color:transparent;animation:spin 9s linear infinite reverse}
@keyframes pulse{0%,100%{transform:scale(.94);filter:brightness(.9)}50%{transform:scale(1.03);filter:brightness(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.18);opacity:0}}
@keyframes softwave{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.08);opacity:0}}
body.listening .orb .ring.w{animation:wave 1.6s ease-out infinite}
body.listening .orb .ring.w2{animation-delay:.53s} body.listening .orb .ring.w3{animation-delay:1.06s}
body.thinking .orb .core{animation:pulse .55s ease-in-out infinite}
body.thinking .orb .ring.s1{animation-duration:3s}
body.speaking .orb .ring.w{border-color:rgba(139,92,246,.5);animation:softwave 2.4s ease-out infinite}
body.speaking .orb .ring.w2{animation-delay:.8s} body.speaking .orb .ring.w3{animation-delay:1.6s}
body.speaking .orb .core{animation:pulse 1.6s ease-in-out infinite}

.aname{font-family:var(--mono);font-weight:800;font-size:26px;letter-spacing:.4em;padding-left:.4em;margin:0;
  background:linear-gradient(90deg,var(--theme),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.line{max-width:760px;width:100%;text-align:center;min-height:1.5em;line-height:1.5;overflow-wrap:anywhere}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-right:6px}
#userLine{color:#9fb6c8;font-size:15px}
#botLine{color:var(--text);font-size:17px}
#status{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--theme);text-align:center;min-height:1.4em}
#status.err{color:var(--err)}
.controls{display:flex;gap:8px;width:100%;max-width:640px;margin-top:4px}
.controls input{flex:1;min-width:0;padding:11px 12px;font-size:15px}
.icon-btn{flex:none;width:46px;height:46px;border-radius:6px;border:1px solid var(--line);background:rgba(0,200,255,.06);color:var(--theme);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.icon-btn:hover{background:rgba(0,200,255,.16)}
.icon-btn.on{background:rgba(0,200,255,.2);box-shadow:0 0 16px rgba(0,200,255,.35)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Second Brain ---------- */
.brain{margin-top:26px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.brain-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brain-title{font-family:var(--mono);letter-spacing:.2em;font-size:13px;font-weight:700}
.brain-sub{font-size:11px;color:var(--muted);margin-top:2px}
.brain-meta{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.brain-meta .icon-btn{width:32px;height:32px}
.brain-meta .icon-btn svg{width:16px;height:16px}
#graph{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
#graph svg{display:block;width:100%;min-width:640px;height:auto}
#graph .edge-flow{stroke-dasharray:4 12;animation:dash 3s linear infinite}
@keyframes dash{to{stroke-dashoffset:-160}}
#graph .core-g{transform-box:fill-box;transform-origin:center;animation:corepulse 2.8s ease-in-out infinite}
@keyframes corepulse{0%,100%{transform:scale(.95)}50%{transform:scale(1.06)}}
#graph .breath{transform-box:fill-box;transform-origin:center;animation:breath 3.6s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.15;transform:scale(.9)}50%{opacity:.75;transform:scale(1.22)}}
#graph .node{cursor:pointer}
#graph .node:hover .nbody{stroke-opacity:1;stroke-width:2}
#graph .flash .nbody{animation:flash .45s ease-in-out 6}
@keyframes flash{50%{fill:#ffffff}}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:12px}
.legend .items{display:flex;flex-wrap:wrap;gap:8px 14px}
.legend .it{display:flex;align-items:center;color:#b8cfdd}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.injected{color:var(--ok);font-family:var(--mono);font-size:11px}

/* ---------- Editor de notas ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.card{width:100%;max-width:460px;background:#06121d;border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 0 40px rgba(0,200,255,.15)}
.card h3{margin:0 0 4px;font-family:var(--mono);letter-spacing:.2em;font-size:14px;color:var(--theme)}
.card label{font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--muted)}
.card input,.card select,.card textarea{width:100%;padding:9px 10px;font-size:15px}
.card textarea{min-height:110px;resize:vertical}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.12em;padding:9px 14px;border-radius:4px;border:1px solid var(--line);background:rgba(0,200,255,.08);color:var(--theme);cursor:pointer}
.btn:hover{background:rgba(0,200,255,.18)}
.btn.danger{color:var(--err);border-color:rgba(255,85,71,.4);background:rgba(255,85,71,.06);margin-right:auto}
.btn.ghost{color:var(--muted);background:transparent}

@media (max-width:600px){
  .orb{width:160px;height:160px} .orb .core{inset:42px} .orb .ring.s1{inset:24px} .orb .ring.s2{inset:11px}
  .aname{font-size:22px} #botLine{font-size:16px}
}

/* ================= UPGRADE: módulos ================= */
.topbar .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip.off{color:var(--err);border-color:rgba(255,85,71,.4)}
.chip.act{color:#03070d;background:var(--theme);border-color:var(--theme);font-weight:700;cursor:pointer;box-shadow:0 0 14px rgba(0,200,255,.45)}
.chip[hidden]{display:none}
.cfg-btn{width:32px;height:32px;font-size:16px}
.modules{margin-top:26px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;
  padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--theme);border-bottom-color:var(--theme);text-shadow:0 0 10px rgba(0,200,255,.5)}
.tab .badge{background:var(--theme);color:#03070d;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;letter-spacing:0}
.tab .badge[hidden]{display:none}
.tabs .spacer{flex:1}
.tabs .tbtn{flex:none;align-self:center;margin:0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--theme);
  background:rgba(0,200,255,.08);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.tabs .tbtn:hover{background:rgba(0,200,255,.18)}
.mpanel{display:none;padding:14px 16px 18px;min-height:180px}
.mpanel.on{display:block;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mhead .meta{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.mhead .icon-btn{width:30px;height:30px}
.mhead .icon-btn svg{width:15px;height:15px}
.notice{border:1px dashed rgba(255,85,71,.45);color:#ffb4ad;border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;margin:6px 0}
.notice.soft{border-color:var(--line);color:var(--muted)}
.dayhead{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--muted);margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.dayhead::after{content:"";flex:1;height:1px;background:var(--line)}
.dayhead.today{color:var(--theme);font-size:13px;margin-top:4px}
.ev{display:flex;gap:12px;align-items:flex-start;padding:8px 10px;border-left:3px solid var(--c,var(--theme));background:rgba(255,255,255,.02);border-radius:0 6px 6px 0;margin:5px 0}
.ev .t{font-family:var(--mono);font-size:13px;color:var(--text);min-width:78px}
.ev .t.allday{font-size:10px;letter-spacing:.15em;color:var(--muted);padding-top:2px}
.ev .b{flex:1;min-width:0}
.ev .ti{font-size:14px;overflow-wrap:anywhere}
.ev .sub{font-size:11px;color:var(--muted);margin-top:2px}
.ev.next{background:rgba(0,200,255,.08);box-shadow:inset 0 0 0 1px rgba(0,200,255,.25)}
.ev.past{opacity:.45}
.cd{font-family:var(--mono);font-size:11px;color:#03070d;background:var(--theme);border-radius:3px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.dot2{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--theme));box-shadow:0 0 6px var(--c,var(--theme));flex:none}
.bucket{margin:4px 0 14px}
.bucket h4{margin:0 0 6px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--muted);display:flex;align-items:center;gap:8px;cursor:default}
.bucket.acao h4{color:var(--theme);text-shadow:0 0 10px rgba(0,200,255,.4)}
.bucket.ruido h4{cursor:pointer}
.bucket .n{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px}
.bucket.collapsed .list{display:none}
.mail{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.mail:hover{border-color:var(--line);background:rgba(255,255,255,.02)}
.bucket.acao .mail{background:rgba(0,200,255,.05);border-color:rgba(0,200,255,.18)}
.mail .dot2{margin-top:6px}
.mail .b{flex:1;min-width:0}
.mail .top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.mail .from{color:#b8cfdd;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .res{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.mail .from.unread{color:var(--theme)}
.mail .orig{display:none;font-size:12px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);overflow-wrap:anywhere}
.mail.open .orig{display:block}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 5px}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ncol h4{margin:0 0 6px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--theme)}
.nitem{display:block;padding:7px 0;border-bottom:1px solid rgba(0,200,255,.08);color:var(--text);text-decoration:none}
.nitem:hover .nt{color:var(--theme)}
.nitem .nt{font-size:14px;line-height:1.35}
.nitem .ns{font-size:11px;color:var(--muted);margin-top:2px}
.digest-box{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:linear-gradient(135deg,rgba(0,200,255,.06),rgba(139,92,246,.06));
  font-size:16px;line-height:1.6;white-space:pre-wrap}
.digest-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wx{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--text);margin-bottom:10px}
.wx b{color:var(--theme);font-size:16px}

/* Definições */
.card.wide{max-width:760px;max-height:90vh;overflow-y:auto}
.cfg-sec{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.cfg-sec h4{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--theme)}
.howto{font-size:12px;color:var(--muted);line-height:1.55;margin:4px 0 8px;padding-left:18px}
.howto code,.warn code{color:var(--text)}
.warn{font-size:12px;color:#ffd58a;border-left:2px solid #fbbf24;padding:4px 10px;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rowl{display:grid;grid-template-columns:1.1fr 2fr 1fr 44px 34px;gap:6px;align-items:center;margin:5px 0}
.rowl input[type=color],.grid2 input[type=color]{padding:0;height:36px;cursor:pointer}
.rowl .x{background:none;border:1px solid rgba(255,85,71,.4);color:var(--err);border-radius:4px;height:34px;cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;font-family:var(--sans);letter-spacing:0}
.chk input{width:auto}
.devcode{font-family:var(--mono);font-size:26px;letter-spacing:.3em;color:var(--theme);text-align:center;padding:8px;border:1px dashed var(--theme);border-radius:6px;margin:6px 0}
.msstate{font-family:var(--mono);font-size:12px;margin:6px 0}
.msstate.ok{color:var(--ok)} .msstate.err{color:var(--err)}
.card a{color:var(--theme)}
@media (max-width:600px){
  .grid2{grid-template-columns:1fr}
  .rowl{grid-template-columns:1fr 1fr 44px 34px}
  .rowl .wide{grid-column:1/-1;order:-1}
  .news-grid{grid-template-columns:1fr}
}

/* ================= HUD (estilo do vídeo) ================= */
.legacy{display:none}
.hud-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 14px}
.datepill{font-family:var(--mono);font-size:13px;color:var(--text);border:1px solid rgba(0,200,255,.55);border-radius:6px;padding:6px 12px;box-shadow:0 0 14px rgba(0,200,255,.18)}
.hud-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:11px}
.upd{color:var(--muted);letter-spacing:.04em}
.hud-top .keybox{flex-basis:100%;display:none}
.hud-top .keybox.show{display:flex}
#keyChip{cursor:pointer}
.hud{position:relative;margin-top:14px;display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:28px;align-items:center;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,rgba(8,22,40,.88),rgba(4,10,20,.88));padding:24px 26px;box-shadow:inset 0 0 70px rgba(0,200,255,.05),0 0 30px rgba(0,0,0,.35)}
.cnr{position:absolute;width:20px;height:20px;border:0 solid var(--theme);opacity:.85;pointer-events:none}
.cnr.tl{top:9px;left:9px;border-width:2px 0 0 2px}.cnr.tr{top:9px;right:9px;border-width:2px 2px 0 0}
.cnr.bl{bottom:9px;left:9px;border-width:0 0 2px 2px}.cnr.br{bottom:9px;right:9px;border-width:0 2px 2px 0}
.hud-orb{position:relative;width:290px;height:290px;margin:auto;display:flex;align-items:center;justify-content:center}
.orbit{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(0,200,255,.22);animation:spin 32s linear infinite;pointer-events:none}
.orbit.o2{inset:28px;border-style:dashed;border-color:rgba(0,200,255,.3);animation-duration:20s;animation-direction:reverse}
.orbit.o3{inset:-14px;border-color:rgba(139,92,246,.28);animation-duration:48s}
.orbit b{position:absolute;top:-3px;left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:var(--theme);box-shadow:0 0 10px var(--theme)}
.orbit.o3 b:nth-child(2){top:auto;bottom:-3px;background:var(--violet);box-shadow:0 0 10px var(--violet)}
.hud-orb .orb{width:210px;height:210px}
.hud-main{min-width:0;display:flex;flex-direction:column}
.hud-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hud-title .aname{padding-left:0;font-size:24px}
.tagline{font-size:12px;color:var(--muted);font-style:italic}
.chat{margin-top:14px;height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(0,200,255,.3) transparent}
.bub{max-width:86%;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:rgba(12,30,52,.85);animation:rise .3s ease both;align-self:flex-start}
.bub .who{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--theme);margin-bottom:3px}
.bub .tx{font-size:14px;line-height:1.45;color:var(--text);overflow-wrap:anywhere;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.38)}
.bub.me .who{color:#c4b5fd}
.chat-empty{margin:auto;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted)}
.hud-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 2px;flex-wrap:wrap}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted)}
.hud #status{text-align:right;font-size:11px}
body.idle .hud #status:not(.err){color:#ff8a7a}
.hud .controls{max-width:none}
.cmdbar{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 14px}
.cmdlbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-right:6px}
.cmd{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text);background:rgba(0,200,255,.05);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;transition:.2s}
.cmd:hover{border-color:var(--theme);color:var(--theme);box-shadow:0 0 12px rgba(0,200,255,.25)}
@media (max-width:820px){
  .hud{grid-template-columns:1fr;gap:12px;padding:20px 16px}
  .hud-orb{width:230px;height:230px}.hud-orb .orb{width:170px;height:170px}
  .hud-title{justify-content:center}.chat{height:200px}
}

/* ================= Aprendizagem ================= */
.ntabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:6px}
.ntab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;cursor:pointer}
.ntab.on{color:var(--theme);border-bottom-color:var(--theme)}
.ncount{background:var(--theme);color:#03070d;border-radius:9px;padding:0 6px;font-weight:700;letter-spacing:0;margin-left:4px}
.npane{display:none}
.npane.on{display:block}
.autolist{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.fact{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:rgba(0,200,255,.04)}
.fact .src{grid-column:1/-1;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--theme)}
.fact .tx{font-size:14px;overflow-wrap:anywhere}
.fact .lnk{color:var(--text);cursor:pointer;font-weight:600}
.fact .lnk:hover{color:var(--theme)}
.fx{background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;width:28px;height:26px;cursor:pointer}
.fx.del:hover{color:var(--err);border-color:rgba(255,85,71,.5)}
.fx.up:hover{color:var(--theme);border-color:var(--theme)}
.fact-empty{font-size:13px;color:var(--muted);padding:10px 2px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.lcard{border:1px solid var(--line);border-radius:8px;padding:12px;background:rgba(0,200,255,.03);display:flex;flex-direction:column;gap:8px}
.lcard h4{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--theme)}
.lcard ol{margin:0;padding-left:18px;font-size:12px;color:var(--muted);line-height:1.5}
.lcard a{color:var(--theme)}
.lcard input[type=file]{font-size:12px;color:var(--muted);padding:6px}
.lcard textarea{width:100%;min-height:90px;padding:8px;font-size:13px}
.lcard select{padding:6px;font-size:13px}
#learnStatus{font-family:var(--mono);font-size:12px;color:var(--theme);min-height:1.4em;margin:4px 0 10px}
#learnStatus.err{color:var(--err)}

/* ================= Rosto de partículas + música ================= */
#faceCv{position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);cursor:pointer;display:none}
body.face #faceCv{display:block}
body.face .hud-orb .orb,body.face .hud-orb .orbit{opacity:0;pointer-events:none}
#photoCv{position:absolute;inset:0;width:100%;height:100%;border-radius:16px;cursor:pointer;display:none;transition:box-shadow .3s}
body.photo #photoCv{display:block}
body.photo .hud-orb{width:300px;height:390px}
body.photo .hud-orb .orb,body.photo .hud-orb .orbit{opacity:0;pointer-events:none}
body.photo.listening #photoCv{box-shadow:0 0 0 2px rgba(0,200,255,.55),0 0 34px rgba(0,200,255,.45)}
body.photo.speaking #photoCv{box-shadow:0 0 0 1px rgba(0,200,255,.35),0 0 26px rgba(0,200,255,.25)}
@media (max-width:820px){body.photo .hud-orb{width:240px;height:312px}}
.musicbar{margin-top:14px;display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;animation:rise .4s ease both}
.musicbar[hidden]{display:none}
.mframe{flex:none;width:256px;height:144px;border-radius:6px;overflow:hidden;background:#000;border:1px solid var(--line)}
.mframe iframe{width:100%;height:100%;border:0;display:block}
.minfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mlbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--theme)}
.mtitle{font-size:16px;overflow-wrap:anywhere}
.msub{font-size:12px;color:var(--muted)}
.mbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mbtns .btn{padding:6px 10px;font-size:14px}
@media (max-width:600px){.musicbar{flex-direction:column;align-items:stretch}.mframe{width:100%;height:auto;aspect-ratio:16/9}}
</style>
</head>

let voice = null, currentUtter = null;
function pickVoice() {
  const list = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const F = /(raquel|helia|joana|catarina|in[eê]s|fernanda|francisca|luciana|helena|maria|leila|vit[oó]ria|camila|thalita|brenda|female|feminin|mulher|google portugu[eê]s do brasil)/i;
  const M = /(duarte|ant[oó]nio|daniel|felipe|ricardo|cristiano|humberto|donato|f[aá]bio|j[uú]lio|\bmale\b|masculin)/i;
  const wantF = CONFIG.voiceGender === "feminina";
  let best = null, bs = -1e9;
  for (const v of list) {
    const l = (v.lang || "").replace("_", "-").toLowerCase();
    if (!l.startsWith("pt")) continue;
    let s = l === "pt-pt" ? 4 : l === "pt-br" ? 2 : 1;
    if (F.test(v.name)) s += wantF ? 5 : -5;
    if (M.test(v.name)) s += wantF ? -5 : 5;
    if (/natural|online|neural/i.test(v.name)) s += 3; // vozes neurais (ex.: Microsoft Raquel Online no Edge) soam muito melhor
    if (s > bs) { bs = s; best = v; }
  }
  return best;
}
if (window.speechSynthesis) {
  voice = pickVoice();
  speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); };
}

function cleanForSpeech(t) {
  return t.replace(/[*_#`>~]/g, "")
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "")
    .replace(/\s+/g, " ").trim();
}

function speak(text) {
  return new Promise(resolve => {
    if (!window.speechSynthesis || !text) { resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
    currentUtter = u; // evita que o Chrome descarte a fala a meio
    if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = CONFIG.lang; }
    u.rate = 1.05; u.pitch = 1.05;
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(t); currentUtter = null; resolve(); };
    u.onend = fin; u.onerror = fin;
    const t = setTimeout(fin, 4000 + text.length * 110); // rede de segurança se o onend nunca chegar
    speechSynthesis.speak(u);
  });
}

// Mostra, fala e no fim liberta o reconhecimento
async function say(text) {
  busy = true;

  setState("speaking");

  activeUntil = Date.now() + CONV_MS;
  setState(idleState());

}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR();
  rec.lang = CONFIG.lang;
  rec.continuous = true;
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onstart = () => { recRunning = true; };
  rec.onresult = e => {
    if (busy || Date.now() < ignoreUntil) return; // nunca me ouço a mim própria
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      const t = e.results[i][0].transcript.trim();
      if (t) handleHeard(t);
      if (busy) break;
    }
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      wantListening = false; updateMic();
      showStatus("MICROFONE BLOQUEADO · PERMITE O ACESSO AO MICROFONE NO NAVEGADOR", true, 8000);
    } else if (e.error === "audio-capture") {
      wantListening = false; updateMic();
      showStatus("NÃO ENCONTREI NENHUM MICROFONE", true, 8000);
    }
  };
  rec.onend = () => {
    recRunning = false;
    if (wantListening && !busy) setTimeout(safeStart, 250);
  };
}
function safeStart() {
  if (!rec || !wantListening || busy) return;
  try { rec.start(); } catch (e) { /* already started */ }
}
function stopListening() {
  wantListening = false;
  if (rec) { try { rec.abort(); } catch (e) {} }
  updateMic();
}

// Procura a wake word na frase; devolve o que vem depois dela
function splitWake(raw) {
  // "I.A." normaliza para "i a": parte em sub-palavras; só a última guarda a palavra original
  const words = raw.split(/\s+/).flatMap(w => norm(w).split(" ").filter(Boolean).map((n, k, arr) => ({ w: k === arr.length - 1 ? w : "", n })));
  for (const v of CONFIG.wakeVariants) {
    const vt = v.split(" ");
    for (let i = 0; i + vt.length <= words.length; i++) {
      let ok = true;
      for (let j = 0; j < vt.length; j++) if (words[i + j].n !== vt[j]) { ok = false; break; }
      if (ok) return { hit: true, rest: words.slice(i + vt.length).map(o => o.w).filter(Boolean).join(" ").replace(/^[\s,.:;!?-]+/, "").trim() };
    }
  }
  return { hit: false, rest: raw };
}

function handleHeard(raw) {
  const awake = Date.now() < activeUntil;
  const { hit, rest } = splitWake(raw);
  if (!hit && !awake) return; // à espera da wake word
  if (hit && !rest) {
    setUser(raw);
    say("Diz, " + CONFIG.address + ".");
    return;
  }
  processCommand(hit ? rest : raw);
}

function processCommand(text) {
  setUser(text);
  ask(text);
}

// Deteta o fornecedor pela chave: "sk-ant-..." = Claude (Anthropic); "AIza..." = Gemini (Google, tem plano gratuito)
function provider(key) { return key.startsWith("sk-ant-") ? "claude" : "gemini"; }

async function callClaude(key) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
      "content-type": "application/json"
    },
    body: JSON.stringify({ model: CONFIG.model, max_tokens: 400, system: buildSystem(), messages: history })
  });
  if (!res.ok) return { status: res.status, detail: await errDetail(res) };
  const data = await res.json();
  return { text: (data && Array.isArray(data.content) ? data.content.filter(b => b.type === "text").map(b => b.text).join("\n") : "").trim() };
}

async function callGemini(key) {
  const body = JSON.stringify({
    systemInstruction: { parts: [{ text: buildSystem() }] },
    contents: history.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })),
    generationConfig: { maxOutputTokens: 1500, temperature: 0.8 }
  });
  let last = null;
  for (const model of CONFIG.geminiModels) {
    const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
      method: "POST",
      headers: { "x-goog-api-key": key, "content-type": "application/json" },
      body
    });
    if (res.ok) {
      const data = await res.json();
      const parts = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      return { text: parts.filter(p => p.text && !p.thought).map(p => p.text).join("\n").trim() };
    }
    last = { status: res.status, detail: await errDetail(res) };
    if (res.status !== 404) break; // só tenta o modelo seguinte se este não existir
  }
  return last;
}

async function errDetail(res) {
  try { const j = await res.json(); return (j && j.error && j.error.message) || ""; } catch (e) { return ""; }
}

async function ask(text) {
  busy = true;
  setState("thinking");
  const key = getKey();
  if (!key) {
    await say(CONFIG.address + ", preciso de uma chave da API. Cola no campo lá em cima uma chave do Gemini ou da Anthropic e tenta outra vez.");
    keyInput.focus();
    return;
  }
  history.push({ role: "user", content: text });
  if (history.length > 24) history = history.slice(-24);
  while (history.length && history[0].role !== "user") history.shift();

  let r;
  try {
    r = provider(key) === "claude" ? await callClaude(key) : await callGemini(key);
  } catch (e) {
    history.pop();
    console.warn(e);
    showStatus("SEM LIGAÇÃO AO SERVIDOR", true, 8000);
    await say("Não consegui ligar ao servidor, " + CONFIG.address + ". Verifica a ligação à internet.");
    return;
  }
  if (r.status) {
    history.pop();
    console.warn("Erro da API", r.status, r.detail);
    showStatus("ERRO " + r.status + (r.detail ? " · " + r.detail : ""), true, 10000);
    const keyBad = r.status === 401 || r.status === 403 || (r.status === 400 && /api key|api_key/i.test(r.detail));
    const msg = keyBad ? "A chave da API foi recusada, " + CONFIG.address + ". Verifica se a colaste bem."
      : r.status === 429 ? "Atingi o limite de pedidos do plano gratuito, " + CONFIG.address + ". Espera um minuto e tenta outra vez."
      : "O servidor devolveu um erro " + r.status + ". Verifica a tua chave da API e tenta outra vez.";
    await say(msg);
    return;
  }
  const reply = r.text || "Fiquei sem resposta desta vez. Podes repetir?";
  const clean = applySaves(reply) || "Fica guardado, " + CONFIG.address + ".";
  history.push({ role: "assistant", content: clean });
  await say(clean);
}

const SAVE_RE = /\[\[SAVE:([a-z_]+)\|([^|]+)\|([\s\S]+?)\]\]/;
function applySaves(text) {
  const re = new RegExp(SAVE_RE.source, "g");
  const flashIds = [];
  for (const m of text.matchAll(re)) {
    const id = upsertNote(m[1], m[2].trim(), m[3].trim());
    if (id) flashIds.push(id);
  }
  const out = text.replace(re, "").replace(/\[\[SAVE[\s\S]*$/, "").replace(/[*#`]/g, "").trim();
  if (flashIds.length) {
    saveNotes();
    renderGraph();
    flashIds.forEach(flashNode);
  }
  return out;
}
function makeId(title) {
  return (norm(title).replace(/ /g, "-") || "nota") + "-" + Date.now().toString(36);
}
// Aprendizagem automática: factos com fonte e data, guardados à parte do conteúdo manual (body)
function addFact(area, title, text, fonte) {
  if (!AREA[area]) area = "meta";
  title = String(title || "").trim().slice(0, 40);
  text = String(text || "").trim().slice(0, 300);
  if (!title || !text) return null;
  let n = notes.find(x => norm(x.title) === norm(title));
  if (!n) { n = { id: makeId(title), area, title, body: "", auto: [] }; notes.push(n); }
  n.auto = n.auto || [];
  if (n.auto.some(f => norm(f.t) === norm(text)) || norm(n.body).includes(norm(text))) return null;
  n.auto.push({ t: text, fonte: fonte || "conversa", d: Date.now() });
  if (n.auto.length > 15) n.auto.splice(0, n.auto.length - 15);
  return n.id;
}
function upsertNote(area, title, body) { return addFact(area, title, body, "conversa"); }
function noteText(n) {
  const auto = (n.auto || []).slice(-6).map(f => f.t).join("; ");
  return [n.body, auto ? "Aprendido: " + auto : ""].filter(Boolean).join(" | ");
}

/* ===================== SECOND BRAIN: GRAFO ===================== */
const graphEl = $("#graph");
let geom = [], pulses = [];
const W = 1000, H = 540, CX = 500, CY = 262, RX = 410, RY = 196;

function renderGraph() {
  const order = Object.keys(AREA);
  const list = [...notes].sort((a, b) => order.indexOf(a.area) - order.indexOf(b.area));
  const ids = new Set(list.map(n => n.id));

  // Arestas: relações fixas + ligação automática para notas novas sem ligações
  const seen = new Set(), edges = [];
  const add = (a, b) => {
    if (a === b || !ids.has(a) || !ids.has(b)) return;
    const k = a < b ? a + "|" + b : b + "|" + a;
    if (seen.has(k)) return;
    seen.add(k); edges.push([a, b]);
  };
  REL.forEach(([a, b]) => add(a, b));
  for (const n of list) {
    if (edges.some(e => e[0] === n.id || e[1] === n.id)) continue;
    const same = list.find(o => o.id !== n.id && o.area === n.area);
    const hub = list.find(o => o.id !== n.id && o.area === "metas") || list.find(o => o.id !== n.id && o.area === "meta");
    if (same) add(n.id, same.id);
    if (hub) add(n.id, hub.id);
  }
  const degree = {};
  edges.forEach(([a, b]) => { degree[a] = (degree[a] || 0) + 1; degree[b] = (degree[b] || 0) + 1; });

  // Posições em elipse
  const pos = {};
  list.forEach((n, i) => {
    const ang = -Math.PI / 2 + (i / list.length) * Math.PI * 2;
    pos[n.id] = { x: CX + RX * Math.cos(ang), y: CY + RY * Math.sin(ang), r: Math.min(26, 9 + (degree[n.id] || 0) * 1.6) };
  });

  geom = edges.map(([a, b]) => {
    const A = pos[a], B = pos[b];
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    return { ax: A.x, ay: A.y, bx: B.x, by: B.y, cx: mx + (CX - mx) * 0.35, cy: my + (CY - my) * 0.35 };
  });

  let s = '<defs>' +
    '<radialGradient id="coreGrad" cx="50%" cy="45%" r="60%"><stop offset="0%" stop-color="#f3e8ff"/><stop offset="45%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#3b0764"/></radialGradient>' +
    '<linearGradient id="edgeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="' + W + '" y2="' + H + '"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>' +
    '<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '<filter id="softglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '</defs>';

  // Raios núcleo → nó
  for (const n of list) {
    const p = pos[n.id];
    s += '<line x1="' + CX + '" y1="' + CY + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '" stroke="' + AREA[n.area].color + '" stroke-opacity=".22" stroke-width="1"/>';
  }
  // Teia de arestas
  geom.forEach((g, i) => {

async function triageNew(list) {

      if (cfg.learn.emails && Array.isArray(j.conhecimento)) learnFacts(j.conhecimento, "Outlook");

        body: JSON.stringify({ host: a.host || "imap.gmail.com", usuario: a.email.trim(), senhaApp: a.senha.replace(/\s+/g, ""), quantidade: q }) })
        .then(add(a.apelido || a.email, a.cor)).catch(fail(a.apelido || a.email)));
    }

    const novos = lista.filter(m => !triage[m.id] || (triage[m.id].local && getKey()));

const RE_MAIL = /\b(e mails?|emails?|mails?|correio|caixa de entrada)\b/;
async function localCommand(text) {
  const n = norm(text), short = n.split(" ").length <= 8, eco = cfg.eng.economia;
  const go = async (tab, fn) => { setUser(text); if (tab) switchTab(tab); const msg = await working(fn()); await sayLong(msg); return true; };
  // Música (YouTube): sempre local
  if (await musicCommand(text, n)) return true;
  // Ações: funcionam sempre
  if (/^(bom dia|bons dias)\b/.test(n) || (short && /\b(digest|briefing)\b/.test(n))) { setUser(text); await runDigest({}); return true; }
  if (/\batualiza\w*\b/.test(n) && RE_MAIL.test(n)) return go("emails", async () => { await loadEmails(true); return "E-mails atualizados. " + sayActions(true); });
  if (/\batualiza\w*\b/.test(n) && /\bnoticias\b/.test(n)) return go("noticias", async () => { await loadNews(true); return "Notícias atualizadas, " + addr + ". Tens " + Object.values(NW.data).reduce((s, l) => s + l.length, 0) + " manchetes no radar."; });
  if (!eco || !short) return false; // sem modo economia, a IA responde com o contexto injetado
  if (RE_MAIL.test(n) && /\b(importantes?|urgentes?)\b/.test(n)) return go("emails", async () => { await loadEmails(false); return sayActions(true); });
  if (/\bproxim[oa]s? (compromisso|reuniao|evento|marcacao|tarefa)\b/.test(n)) return go("agenda", async () => { await ensureAgenda(); return sayNext(); });
  if (/\b(agenda|compromissos) (da|desta|para a|para esta) semana\b|\bproximos dias\b|\bresto da semana\b/.test(n)) return go("agenda", async () => { await ensureAgenda(); return sayWeek(); });
  if (/\b(minha agenda|a agenda|agenda de hoje|o que (e que )?(eu )?tenho (para )?hoje|tenho hoje|compromissos de hoje|o meu dia)\b/.test(n)) return go("agenda", async () => { await ensureAgenda(); return sayToday(); });
  const mt = n.match(/\bnoticias (de|sobre|da|do|dos|das|acerca de) (.+)$/);
  if (mt) {
    const q = mt[2].trim();
    const topic = cfg.news.temas.find(t => { const a = norm(t.nome), b = norm(t.q || ""); return a.includes(q) || q.includes(a) || b.includes(q) || a.split(" ").some(w => w.length > 3 && q.includes(w)); });
    return go("noticias", async () => { if (topic) { await loadNews(false); return sayNews(topic); } return sayTopicAdhoc(q); });
  }
  if (/\bnoticias\b/.test(n)) return go("noticias", async () => { await loadNews(false); return sayNews(null); });
  if (RE_MAIL.test(n)) return go("emails", async () => { await loadEmails(false); return sayActions(false); });
  return false;
}

  if (!handled) return _processCommand(text);
};

async function unzip(file, want) {

  fctx.strokeStyle = violet ? "rgba(167,139,250,0.2)" : "rgba(0,200,255," + (0.15 + (st === "speaking" ? mouth * 0.12 : 0)) + ")";
  fctx.beginPath();
  for (const [a, b] of FE) { const A = FP[a], B = FP[b]; if (A.d < -0.3 && B.d < -0.3) continue; fctx.moveTo(A.sx, A.sy); fctx.lineTo(B.sx, B.sy); }
  fctx.stroke();
  const spr = violet ? SPR.violet : SPR.blue;
  for (const p of FP) {
    let a = Math.max(0.12, Math.min(1, (p.d + 0.6) / 1.1)) * (p.f ? 1 : 0.5);
    if (p.role === 9) a *= 0.5 + 0.5 * Math.sin(t * 1.3 + p.ph);
    if (st === "listening") a *= 0.75 + 0.45 * Math.max(0, Math.sin(t * 6 - p.y * 6));
    if (violet) a *= 0.65 + 0.5 * Math.max(0, Math.sin(t * 8 + p.x * 10 + p.y * 7));
    const r = (p.f === 2 ? 3.4 : p.f ? 2.1 : 1.4) * sc / 160;
    fctx.globalAlpha = Math.min(1, a);
    fctx.drawImage(spr, p.sx - r * 2, p.sy - r * 2, r * 4, r * 4);
  }
  fctx.globalAlpha = 1;
  fctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(faceFrame);
}

/* =====================================================================
   MÚSICA: pesquisa no YouTube pela antena e toca num leitor incorporado
   ===================================================================== */
const MU = { list: [], i: 0, playing: false, paused: false, vol: 70, errors: 0, frame: null };
function ytCmd(func, args) { const f = MU.frame; if (f && f.contentWindow) f.contentWindow.postMessage(JSON.stringify({ event: "command", func, args: args || [] }), "*"); }
function musicDuck(on) { if (MU.playing && !MU.paused) ytCmd("setVolume", [on ? Math.round(MU.vol * 0.2) : MU.vol]); }
function loadVideo() {
  const v = MU.list[MU.i];
  if (!v) return musicStop();
  $("#musicBar").hidden = false;
  const box = $("#ytBox"), f = document.createElement("iframe");
  f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(v.id) + "?autoplay=1&enablejsapi=1&playsinline=1&rel=0" +
    (location.origin.startsWith("http") ? "&origin=" + encodeURIComponent(location.origin) : "");
  f.allow = "autoplay; encrypted-media; picture-in-picture";
  f.title = "YouTube";
  f.onload = () => { try { f.contentWindow.postMessage(JSON.stringify({ event: "listening", id: "apia" }), "*"); } catch (e) {} setTimeout(() => ytCmd("setVolume", [MU.vol]), 900); };
  box.innerHTML = "";
  box.appendChild(f);
  Object.assign(MU, { frame: f, playing: true, paused: false });
  $("#ytTitle").textContent = v.titulo;
  $("#ytSub").textContent = [v.canal, v.duracao].filter(Boolean).join(" · ");
}
function musicStop() { Object.assign(MU, { playing: false, paused: false, frame: null }); $("#ytBox").innerHTML = ""; $("#musicBar").hidden = true; }
function musicNext() { if (!MU.list.length) return; MU.i = (MU.i + 1) % MU.list.length; loadVideo(); }
window.addEventListener("message", e => {
  let host = "";
  try { host = new URL(e.origin).hostname; } catch (x) { return; }
  if (!/(^|\.)youtube(-nocookie)?\.com$/.test(host)) return;
  let d;
  try { d = typeof e.data === "string" ? JSON.parse(e.data) : e.data; } catch (x) { return; }
  if (!d) return;
  if (d.event === "onError") { // vídeo que não deixa ser incorporado: passa ao seguinte
    if (++MU.errors >= MU.list.length) { musicStop(); setStatusMsg("NENHUM DESTES VÍDEOS PODE TOCAR AQUI"); } else musicNext();
  }
  if ((d.event === "infoDelivery" && d.info && d.info.playerState === 0) || (d.event === "onStateChange" && d.info === 0)) musicNext();
  if (d.event === "onReady" || (d.event === "infoDelivery" && d.info && d.info.playerState === 1)) MU.errors = 0;
});
function setStatusMsg(m) { showStatus(m, true, 6000); }
$("#ytPause").onclick = () => { if (MU.paused) { ytCmd("playVideo"); MU.paused = false; } else { ytCmd("pauseVideo"); MU.paused = true; } };
$("#ytNext").onclick = musicNext;
$("#ytStop").onclick = musicStop;
$("#ytVolUp").onclick = () => { MU.vol = Math.min(100, MU.vol + 15); ytCmd("setVolume", [MU.vol]); };
$("#ytVolDown").onclick = () => { MU.vol = Math.max(5, MU.vol - 15); ytCmd("setVolume", [MU.vol]); };
const MUSIC_STOP = new Set(["poe", "toca", "tocar", "coloca", "mete", "liga", "quero", "ouvir", "reproduz", "play", "a", "uma", "um", "o", "os", "as", "musica", "musicas",
  "cancao", "cancoes", "som", "playlist", "no", "do", "youtube", "de", "da", "dos", "das", "me", "ai", "la", "algo", "alguma", "qualquer"]);
function musicQuery(text) {
  const words = text.replace(/[?!.,]+/g, " ").split(/\s+/).filter(Boolean);
  let i = 0;
  while (i < words.length && MUSIC_STOP.has(norm(words[i]))) i++;
  return words.slice(i).join(" ").replace(/\s+no youtube$/i, "").trim();
}
async function musicCommand(text, n) {
  const short = n.split(" ").length <= 6;
  const say1 = async (msg) => { setUser(text); await sayLong(msg); return true; };
  if (MU.playing) {
    if (/\b(para|pare|parar|desliga|tira|stop)\b.*\b(musica|som)\b|^(para|stop|chega)$/.test(n)) { musicStop(); return say1("Música desligada."); }
    if (/\b(pausa|pausar|pausa a)\b/.test(n) && short) { ytCmd("pauseVideo"); MU.paused = true; setUser(text); return true; }
    if (/\b(continua|retoma|volta a tocar|play)\b/.test(n) && short) { ytCmd("playVideo"); MU.paused = false; setUser(text); return true; }
    if (/\b(proxima|seguinte|salta|outra)\b/.test(n) && short) { musicNext(); setUser(text); return true; }
    if (/\b(aumenta|sobe|mais alto)\b/.test(n) && short) { MU.vol = Math.min(100, MU.vol + 20); setUser(text); return true; }
    if (/\b(baixa|diminui|mais baixo)\b/.test(n) && short) { MU.vol = Math.max(5, MU.vol - 20); setUser(text); return true; }
  }
  const isMusic = /^(toca|tocar|reproduz|play)\b/.test(n) || (/\b(musica|musicas|cancao|playlist|youtube)\b/.test(n) && /^(poe|coloca|mete|liga|quero ouvir|ouvir|apetece me ouvir)\b/.test(n));
  if (!isMusic) return false;
  setUser(text);
  const q = musicQuery(text) || "música para trabalhar concentrado";
  let list;
  try {
    busy = true; setState("thinking");
    list = (await antJson("/api/youtube?q=" + encodeURIComponent(q), { timeout: 20000 })).videos || [];
  } catch (e) {
    busy = false;
    await sayLong(e instanceof AntOff ? "A antena está desligada, " + addr + ". Corre o iniciar-apiav1.bat para eu ir ao YouTube." : "Não consegui pesquisar no YouTube: " + e.message);
    return true;
  } finally { busy = false; }
  if (!list.length) { await sayLong("Não encontrei nada no YouTube para " + q + "."); return true; }
  Object.assign(MU, { list, i: 0, errors: 0 });
  await sayLong("A pôr " + list[0].titulo.replace(/\s*[\(\[].*?[\)\]]/g, "") + ".");
  loadVideo();
  return true;
}

const chatLog = $("#chatLog");
chatLog.innerHTML = '<div class="chat-empty">ATIVA O SISTEMA E DIZ "' + WAKE_DISPLAY.toUpperCase() + '"</div>';
function bubble(who, text, me) {
  const e = chatLog.querySelector(".chat-empty");
  if (e) e.remove();
  const d = document.createElement("div");
  d.className = "bub" + (me ? " me" : "");
  d.innerHTML = '<div class="who"></div><div class="tx"></div>';
  d.firstChild.textContent = who;
  d.lastChild.textContent = text;
  chatLog.appendChild(d);
  while (chatLog.children.length > 40) chatLog.firstChild.remove();
  chatLog.scrollTop = chatLog.scrollHeight;
}
const _setUser = setUser, _setBot = setBot;
setUser = function (t) { _setUser(t); bubble("TU", t, true); };
setBot = function (t) { _setBot(t); bubble(CONFIG.name, t, false); };

document.querySelectorAll(".cmd").forEach(b => b.addEventListener("click", () => {

  stopLong = true;
  stopCloud();

document.addEventListener("keydown", e => {
  if (e.code !== "Space" || e.repeat) return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (/INPUT|TEXTAREA|SELECT|BUTTON/.test(tag) || !$("#app").classList.contains("show") || document.querySelector(".modal.open")) return;
  e.preventDefault();
  $("#orb").click();
});
