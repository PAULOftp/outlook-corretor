<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rissa</title>
<style>
:root{
  --theme:#00c8ff; --violet:#8b5cf6; --bg:#03070d; --panel:rgba(6,18,30,.78);
  --line:rgba(0,200,255,.22); --text:#d9f4ff; --muted:#6f8aa0; --ok:#10b981; --err:#ff5547;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#0a2238 0%,var(--bg) 62%) fixed;background-color:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,200,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.035) 1px,transparent 1px);background-size:40px 40px}

/* ---------- Ecrãs de arranque ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:var(--bg);transition:opacity .7s ease;padding:16px;text-align:center}
#boot{z-index:51} #activate{z-index:50}
.screen.hide{opacity:0;pointer-events:none}
.gtitle{font-family:var(--mono);font-weight:800;letter-spacing:.35em;padding-left:.35em;font-size:clamp(44px,13vw,112px);margin:0;
  background:linear-gradient(90deg,var(--theme),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(0,200,255,.35))}
.ghr{width:min(520px,80vw);height:2px;border:0;margin:0;background:linear-gradient(90deg,transparent,var(--theme),var(--violet),transparent)}
.blink{font-family:var(--mono);letter-spacing:.3em;font-size:13px;color:var(--theme);animation:blink 1s steps(2) infinite}
.ver{font-family:var(--mono);font-size:11px;letter-spacing:.25em;color:var(--muted)}
@keyframes blink{50%{opacity:.15}}
.btn-activate{font-family:var(--mono);font-size:18px;letter-spacing:.2em;color:var(--theme);background:rgba(0,200,255,.06);
  border:1px solid var(--theme);padding:16px 34px;border-radius:4px;cursor:pointer;transition:.2s;
  box-shadow:0 0 24px rgba(0,200,255,.25),inset 0 0 18px rgba(0,200,255,.12)}
.btn-activate:hover{background:rgba(0,200,255,.16);box-shadow:0 0 40px rgba(0,200,255,.5)}

/* ---------- App ---------- */
#app{position:relative;z-index:1;opacity:0;transition:opacity .8s;max-width:1100px;margin:0 auto;padding:12px 16px 40px}
#app.show{opacity:1}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-family:var(--mono);font-size:12px}
.keybox{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.keybox span{color:var(--muted);letter-spacing:.15em;white-space:nowrap}
input,select,textarea{background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--text);border-radius:4px;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--theme);box-shadow:0 0 0 2px rgba(0,200,255,.15)}
.keybox input{flex:1;min-width:0;padding:8px 10px;font-family:var(--mono);font-size:12px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:20px;color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(16,185,129,.45)}

.hero{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px}
.orb{position:relative;width:200px;height:200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.orb .core{position:absolute;inset:52px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#fff 0%,#c4f5ff 12%,var(--theme) 40%,rgba(0,90,160,.65) 72%,rgba(0,40,80,.2) 100%);
  box-shadow:0 0 40px var(--theme),0 0 90px rgba(0,200,255,.35),inset 0 0 20px rgba(255,255,255,.5);
  animation:pulse 3.4s ease-in-out infinite}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0,200,255,.45);opacity:0;pointer-events:none}
.orb .ring.s1{inset:30px;opacity:1;border:1px dashed rgba(0,200,255,.5);animation:spin 18s linear infinite}
.orb .ring.s2{inset:14px;opacity:1;border:1px solid rgba(139,92,246,.45);border-left-color:transparent;border-right-color:transparent;animation:spin 9s linear infinite reverse}
@keyframes pulse{0%,100%{transform:scale(.94);filter:brightness(.9)}50%{transform:scale(1.03);filter:brightness(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.18);opacity:0}}
@keyframes softwave{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.08);opacity:0}}
body.listening .orb .ring.w{animation:wave 1.6s ease-out infinite}
body.listening .orb .ring.w2{animation-delay:.53s} body.listening .orb .ring.w3{animation-delay:1.06s}
body.thinking .orb .core{animation:pulse .55s ease-in-out infinite}
body.thinking .orb .ring.s1{animation-duration:3s}
body.speaking .orb .ring.w{border-color:rgba(139,92,246,.5);animation:softwave 2.4s ease-out infinite}
body.speaking .orb .ring.w2{animation-delay:.8s} body.speaking .orb .ring.w3{animation-delay:1.6s}
body.speaking .orb .core{animation:pulse 1.6s ease-in-out infinite}

.aname{font-family:var(--mono);font-weight:800;font-size:26px;letter-spacing:.4em;padding-left:.4em;margin:0;
  background:linear-gradient(90deg,var(--theme),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.line{max-width:760px;width:100%;text-align:center;min-height:1.5em;line-height:1.5;overflow-wrap:anywhere}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-right:6px}
#userLine{color:#9fb6c8;font-size:15px}
#botLine{color:var(--text);font-size:17px}
#status{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--theme);text-align:center;min-height:1.4em}
#status.err{color:var(--err)}
.controls{display:flex;gap:8px;width:100%;max-width:640px;margin-top:4px}
.controls input{flex:1;min-width:0;padding:11px 12px;font-size:15px}
.icon-btn{flex:none;width:46px;height:46px;border-radius:6px;border:1px solid var(--line);background:rgba(0,200,255,.06);color:var(--theme);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.icon-btn:hover{background:rgba(0,200,255,.16)}
.icon-btn.on{background:rgba(0,200,255,.2);box-shadow:0 0 16px rgba(0,200,255,.35)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Second Brain ---------- */
.brain{margin-top:26px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.brain-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brain-title{font-family:var(--mono);letter-spacing:.2em;font-size:13px;font-weight:700}
.brain-sub{font-size:11px;color:var(--muted);margin-top:2px}
.brain-meta{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.brain-meta .icon-btn{width:32px;height:32px}
.brain-meta .icon-btn svg{width:16px;height:16px}
#graph{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
#graph svg{display:block;width:100%;min-width:640px;height:auto}
#graph .edge-flow{stroke-dasharray:4 12;animation:dash 3s linear infinite}
@keyframes dash{to{stroke-dashoffset:-160}}
#graph .core-g{transform-box:fill-box;transform-origin:center;animation:corepulse 2.8s ease-in-out infinite}
@keyframes corepulse{0%,100%{transform:scale(.95)}50%{transform:scale(1.06)}}
#graph .breath{transform-box:fill-box;transform-origin:center;animation:breath 3.6s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.15;transform:scale(.9)}50%{opacity:.75;transform:scale(1.22)}}
#graph .node{cursor:pointer}
#graph .node:hover .nbody{stroke-opacity:1;stroke-width:2}
#graph .flash .nbody{animation:flash .45s ease-in-out 6}
@keyframes flash{50%{fill:#ffffff}}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:12px}
.legend .items{display:flex;flex-wrap:wrap;gap:8px 14px}
.legend .it{display:flex;align-items:center;color:#b8cfdd}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.injected{color:var(--ok);font-family:var(--mono);font-size:11px}

/* ---------- Editor de notas ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.card{width:100%;max-width:460px;background:#06121d;border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 0 40px rgba(0,200,255,.15)}
.card h3{margin:0 0 4px;font-family:var(--mono);letter-spacing:.2em;font-size:14px;color:var(--theme)}
.card label{font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--muted)}
.card input,.card select,.card textarea{width:100%;padding:9px 10px;font-size:15px}
.card textarea{min-height:110px;resize:vertical}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.12em;padding:9px 14px;border-radius:4px;border:1px solid var(--line);background:rgba(0,200,255,.08);color:var(--theme);cursor:pointer}
.btn:hover{background:rgba(0,200,255,.18)}
.btn.danger{color:var(--err);border-color:rgba(255,85,71,.4);background:rgba(255,85,71,.06);margin-right:auto}
.btn.ghost{color:var(--muted);background:transparent}

@media (max-width:600px){
  .orb{width:160px;height:160px} .orb .core{inset:42px} .orb .ring.s1{inset:24px} .orb .ring.s2{inset:11px}
  .aname{font-size:22px} #botLine{font-size:16px}
}
</style>
</head>
<body>

<!-- ECRÃ 1: BOOT -->
<div id="boot" class="screen">
  <h1 class="gtitle" id="bootName"></h1>
  <hr class="ghr">
  <div class="blink">A SINCRONIZAR DADOS...</div>
  <div class="ver">v5.0 · REBUILD</div>
</div>

<!-- ECRÃ 2: ATIVAÇÃO -->
<div id="activate" class="screen hide">
  <h1 class="gtitle" id="actName"></h1>
  <button class="btn-activate" id="btnActivate" type="button">► ATIVAR SISTEMA</button>
  <div class="ver">CLICA PARA INICIAR</div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <label class="keybox"><span>API KEY</span>
      <input id="apiKey" type="password" placeholder="Cola aqui a tua chave sk-ant-..." autocomplete="off" spellcheck="false">
    </label>
    <span class="chip" id="keyChip">SEM CHAVE</span>
  </div>

  <div class="hero">
    <div class="orb" id="orb" title="Clica para eu te ouvir">
      <div class="ring w w1"></div><div class="ring w w2"></div><div class="ring w w3"></div>
      <div class="ring s1"></div><div class="ring s2"></div>
      <div class="core"></div>
    </div>
    <h2 class="aname" id="appName"></h2>
    <div class="line" id="userLine"><span class="lbl">TU</span><span id="userText">—</span></div>
    <div class="line" id="botLine"><span class="lbl" id="botLbl"></span><span id="botText">—</span></div>
    <div id="status"></div>
    <div class="controls">
      <input id="textInput" type="text" placeholder="ou escreve e carrega em Enter" autocomplete="off">
      <button class="icon-btn" id="micBtn" type="button" title="Microfone">
        <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
      </button>
      <button class="icon-btn" id="stopBtn" type="button" title="Interromper a fala">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      </button>
    </div>
  </div>

  <section class="brain">
    <div class="brain-head">
      <div>
        <div class="brain-title">🧠 SECOND BRAIN</div>
        <div class="brain-sub">Memória pessoal · clica num nó para editar</div>
      </div>
      <div class="brain-meta">
        <span id="counter"></span>
        <button class="icon-btn" id="addBtn" type="button" title="Nova nota">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="reloadBtn" type="button" title="Recarregar">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
      </div>
    </div>
    <div id="graph"></div>
    <div class="legend">
      <div class="items" id="legendItems"></div>
      <div class="injected" id="injected"></div>
    </div>
  </section>
</div>

<!-- EDITOR -->
<div class="modal" id="modal">
  <div class="card">
    <h3 id="modalTitle">NOTA</h3>
    <label for="fTitle">TÍTULO</label>
    <input id="fTitle" type="text" maxlength="40">
    <label for="fArea">ÁREA</label>
    <select id="fArea"></select>
    <label for="fBody">CONTEÚDO</label>
    <textarea id="fBody"></textarea>
    <div class="row">
      <button class="btn danger" id="fDelete" type="button">ELIMINAR</button>
      <button class="btn ghost" id="fCancel" type="button">CANCELAR</button>
      <button class="btn" id="fSave" type="button">GUARDAR</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ===================== CONFIGURAÇÃO ===================== */
const CONFIG = {
  name: "Rissa",
  address: "Paulo",
  themeColor: "#00c8ff",
  persona: "descontraída",
  wakeWord: "ola rissa",
  wakeVariants: ["ola rissa", "ola risa", "ola rita"], // transcrições erradas comuns
  voiceGender: "feminina",
  lang: "pt-PT",
  model: "claude-sonnet-5-5"
};

const AREA = {
  meta:        { label: "Eu",           color: "#8a90a6" },
  metas:       { label: "Metas",        color: "#fbbf24" },
  trabalho:    { label: "Carreira",     color: "#ff5547" },
  projetos:    { label: "Projetos",     color: "#8b7cff" },
  financas:    { label: "Finanças",     color: "#f7931a" },
  aprendizado: { label: "Aprendizagem", color: "#2dd4ff" },
  saude:       { label: "Saúde",        color: "#10b981" },
  relacoes:    { label: "Relações",     color: "#ec4899" }
};

const NOTES = [
  { id: "paulo",         area: "meta",        title: "Paulo",             body: "António Paulo, tratado por Paulo. Tem 49 anos e vive em Avanca." },
  { id: "lic2027",       area: "metas",       title: "Licenciatura 2027", body: "Terminar a licenciatura em 2027." },
  { id: "consultor",     area: "metas",       title: "Consultor",         body: "Passar a trabalhar como consultor e formador em empresas." },
  { id: "ftp",           area: "trabalho",    title: "FTP Porto",         body: "Diretor Comercial na FTP Porto, empresa que vende software a empresas." },
  { id: "negocios",      area: "projetos",    title: "Negócios",          body: "Vários negócios comerciais em curso na FTP Porto." },
  { id: "curso",         area: "projetos",    title: "Curso",             body: "Licenciatura a decorrer, com conclusão prevista para 2027." },
  { id: "independencia", area: "financas",    title: "Independência",     body: "Objetivo de chegar à independência financeira, sem precisar de trabalhar." },
  { id: "marketing",     area: "aprendizado", title: "Marketing",         body: "Cadeira de Plano de Marketing." },
  { id: "canais",        area: "aprendizado", title: "Canais",            body: "Cadeira de Canais de Distribuição." },
  { id: "financasuc",    area: "aprendizado", title: "Finanças UC",       body: "Cadeira de Finanças." },
  { id: "vendas",        area: "aprendizado", title: "Vendas",            body: "Cadeira de Vendas." },
  { id: "corrida",       area: "saude",       title: "Corrida",           body: "Corre 15 minutos por dia." },
  { id: "sara",          area: "relacoes",    title: "Sara",              body: "Mulher do Paulo." },
  { id: "rodrigo",       area: "relacoes",    title: "Rodrigo",           body: "Filho do Paulo." }
];

const REL = [
  ["lic2027", "curso"], ["lic2027", "marketing"], ["lic2027", "canais"], ["lic2027", "financasuc"], ["lic2027", "vendas"],
  ["lic2027", "consultor"], ["lic2027", "paulo"],
  ["consultor", "ftp"], ["consultor", "vendas"], ["consultor", "independencia"], ["consultor", "paulo"], ["consultor", "marketing"],
  ["ftp", "negocios"], ["ftp", "vendas"], ["ftp", "canais"], ["ftp", "paulo"],
  ["negocios", "vendas"], ["negocios", "independencia"],
  ["independencia", "financasuc"], ["independencia", "paulo"],
  ["curso", "marketing"], ["curso", "canais"], ["curso", "financasuc"], ["curso", "vendas"],
  ["corrida", "paulo"], ["sara", "paulo"], ["rodrigo", "paulo"], ["sara", "rodrigo"],
  ["sara", "independencia"], ["rodrigo", "independencia"]
];

/* ===================== UTILITÁRIOS ===================== */
const $ = s => document.querySelector(s);
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const WAKE_DISPLAY = "Olá " + CONFIG.name;
const CONV_MS = 12000; // janela em que continuo a ouvir sem a wake word, depois de falar

/* ===================== ESTADO ===================== */
let notes = loadNotes();
let history = [];
let busy = false, ignoreUntil = 0, activeUntil = 0;
let wantListening = false, recRunning = false;
let uiState = "", statusLockUntil = 0;

function loadNotes() {
  try {
    const r = JSON.parse(LS.get("jarvis_notes"));
    if (Array.isArray(r)) return r.filter(n => n && n.id && n.title && n.area);
  } catch (e) {}
  return NOTES.map(n => ({ ...n }));
}
function saveNotes() { LS.set("jarvis_notes", JSON.stringify(notes)); }

/* ===================== INTERFACE ===================== */
["#bootName", "#actName", "#appName"].forEach(s => $(s).textContent = CONFIG.name.toUpperCase());
$("#botLbl").textContent = CONFIG.name.toUpperCase();
$("#injected").textContent = "✓ contexto injetado em todos os comandos da " + CONFIG.name;

function setUser(t) { $("#userText").textContent = t; }
function setBot(t) { $("#botText").textContent = t; }
function showStatus(t, err, lockMs) {
  const el = $("#status");
  el.textContent = t;
  el.classList.toggle("err", !!err);
  if (lockMs) statusLockUntil = Date.now() + lockMs;
}
function setState(s) {
  if (s !== uiState) {
    document.body.classList.remove("idle", "listening", "thinking", "speaking");
    document.body.classList.add(s);
    uiState = s;
  }
  if (Date.now() < statusLockUntil) return;
  const txt = {
    listening: "A OUVIR...",
    thinking: "A PENSAR...",
    speaking: "A FALAR...",
    idle: !SR ? "VOZ INDISPONÍVEL NESTE NAVEGADOR · ESCREVE ABAIXO"
        : wantListening ? 'À ESPERA DE "' + WAKE_DISPLAY.toUpperCase() + '"' : "MICROFONE DESLIGADO"
  }[s];
  showStatus(txt, false);
}
function idleState() {
  return (wantListening && recRunning && Date.now() < activeUntil) ? "listening" : "idle";
}
setInterval(() => { if (!busy && uiState) setState(idleState()); }, 400);

// Chave da API
const keyInput = $("#apiKey");
keyInput.value = LS.get("anthropic_key") || "";
function getKey() { return keyInput.value.trim(); }
function refreshKeyChip() {
  const ok = !!getKey();
  $("#keyChip").textContent = ok ? "CHAVE OK" : "SEM CHAVE";
  $("#keyChip").classList.toggle("ok", ok);
}
keyInput.addEventListener("input", () => { LS.set("anthropic_key", getKey()); refreshKeyChip(); });
refreshKeyChip();

/* ===================== VOZ: TTS ===================== */
let voice = null, currentUtter = null;
function pickVoice() {
  const list = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const F = /(raquel|helia|joana|catarina|in[eê]s|fernanda|francisca|luciana|helena|maria|leila|vit[oó]ria|camila|thalita|brenda|female|feminin|mulher|google portugu[eê]s do brasil)/i;
  const M = /(duarte|ant[oó]nio|daniel|felipe|ricardo|cristiano|humberto|donato|f[aá]bio|j[uú]lio|\bmale\b|masculin)/i;
  const wantF = CONFIG.voiceGender === "feminina";
  let best = null, bs = -1e9;
  for (const v of list) {
    const l = (v.lang || "").replace("_", "-").toLowerCase();
    if (!l.startsWith("pt")) continue;
    let s = l === "pt-pt" ? 4 : l === "pt-br" ? 2 : 1;
    if (F.test(v.name)) s += wantF ? 5 : -5;
    if (M.test(v.name)) s += wantF ? -5 : 5;
    if (s > bs) { bs = s; best = v; }
  }
  return best;
}
if (window.speechSynthesis) {
  voice = pickVoice();
  speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); };
}

function cleanForSpeech(t) {
  return t.replace(/[*_#`>~]/g, "")
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "")
    .replace(/\s+/g, " ").trim();
}

function speak(text) {
  return new Promise(resolve => {
    if (!window.speechSynthesis || !text) { resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
    currentUtter = u; // evita que o Chrome descarte a fala a meio
    if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = CONFIG.lang; }
    u.rate = 1.05; u.pitch = 1.05;
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(t); currentUtter = null; resolve(); };
    u.onend = fin; u.onerror = fin;
    const t = setTimeout(fin, 4000 + text.length * 110); // rede de segurança se o onend nunca chegar
    speechSynthesis.speak(u);
  });
}

// Mostra, fala e no fim liberta o reconhecimento
async function say(text) {
  busy = true;
  setBot(text);
  setState("speaking");
  await speak(text);
  busy = false;
  ignoreUntil = Date.now() + 700; // corta o eco final da própria voz
  activeUntil = Date.now() + CONV_MS;
  setState(idleState());
  safeStart();
}

/* ===================== VOZ: STT ===================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR();
  rec.lang = CONFIG.lang;
  rec.continuous = true;
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onstart = () => { recRunning = true; };
  rec.onresult = e => {
    if (busy || Date.now() < ignoreUntil) return; // nunca me ouço a mim própria
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      const t = e.results[i][0].transcript.trim();
      if (t) handleHeard(t);
      if (busy) break;
    }
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      wantListening = false; updateMic();
      showStatus("MICROFONE BLOQUEADO · PERMITE O ACESSO AO MICROFONE NO NAVEGADOR", true, 8000);
    } else if (e.error === "audio-capture") {
      wantListening = false; updateMic();
      showStatus("NÃO ENCONTREI NENHUM MICROFONE", true, 8000);
    }
  };
  rec.onend = () => {
    recRunning = false;
    if (wantListening && !busy) setTimeout(safeStart, 250);
  };
}
function safeStart() {
  if (!rec || !wantListening || busy) return;
  try { rec.start(); } catch (e) { /* already started */ }
}
function stopListening() {
  wantListening = false;
  if (rec) { try { rec.abort(); } catch (e) {} }
  updateMic();
}
function updateMic() { $("#micBtn").classList.toggle("on", wantListening); }

// Procura a wake word na frase; devolve o que vem depois dela
function splitWake(raw) {
  const words = raw.split(/\s+/).map(w => ({ w, n: norm(w) })).filter(o => o.n);
  for (const v of CONFIG.wakeVariants) {
    const vt = v.split(" ");
    for (let i = 0; i + vt.length <= words.length; i++) {
      let ok = true;
      for (let j = 0; j < vt.length; j++) if (words[i + j].n !== vt[j]) { ok = false; break; }
      if (ok) return { hit: true, rest: words.slice(i + vt.length).map(o => o.w).join(" ").replace(/^[\s,.:;!?-]+/, "").trim() };
    }
  }
  return { hit: false, rest: raw };
}

function handleHeard(raw) {
  const awake = Date.now() < activeUntil;
  const { hit, rest } = splitWake(raw);
  if (!hit && !awake) return; // à espera da wake word
  if (hit && !rest) {
    setUser(raw);
    say("Diz, " + CONFIG.address + ".");
    return;
  }
  processCommand(hit ? rest : raw);
}

function processCommand(text) {
  setUser(text);
  ask(text);
}

/* ===================== CÉREBRO: CLAUDE ===================== */
function buildSystem() {
  const now = new Date().toLocaleString("pt-PT", { weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
  let brain = "";
  for (const k of Object.keys(AREA)) {
    const ns = notes.filter(n => n.area === k);
    if (!ns.length) continue;
    brain += "\n\n## " + AREA[k].label + " (" + k + ")\n" + ns.map(n => "- " + n.title + ": " + n.body).join("\n");
  }
  return [
    "És a " + CONFIG.name + ", a assistente pessoal de voz do " + CONFIG.address + ". Personalidade " + CONFIG.persona +
    ": próxima, bem-disposta e informal, com humor leve, mas sempre útil e certeira. Tratas o " + CONFIG.address +
    " por tu e chamas-lhe " + CONFIG.address + ".",
    "REGRAS DE RESPOSTA: respondes sempre em português europeu (de Portugal), nunca em português do Brasil. " +
    "As tuas respostas são lidas em voz alta: 2 a 4 frases curtas e naturais, sem emojis, sem markdown, sem listas, sem títulos. " +
    "Escreve números e siglas de forma fácil de dizer. Data e hora atuais: " + now + ".",
    "SECOND BRAIN DO " + CONFIG.address.toUpperCase() + " (o que sabes sobre a vida dele; usa-o para personalizar as respostas, sem o recitar):" + brain,
    "PROTOCOLO DE MEMÓRIA VIVA: se o utilizador revelar algo novo e duradouro sobre a vida dele, TERMINA a resposta com uma linha no formato EXATO " +
    "[[SAVE:area|titulo|texto]] (area ∈ metas, trabalho, projetos, financas, aprendizado, saude, relacoes, meta; titulo com 1 a 2 palavras). " +
    "Se já existir nota com esse título, ela é atualizada (escreve então o texto completo e atualizado); senão nasce uma nova. " +
    "Inclui só quando houver algo realmente novo. Nunca menciones esta linha na parte falada."
  ].join("\n\n");
}

async function ask(text) {
  busy = true;
  setState("thinking");
  const key = getKey();
  if (!key) {
    await say(CONFIG.address + ", preciso da tua chave da API da Anthropic. Cola-a no campo lá em cima e tenta outra vez.");
    keyInput.focus();
    return;
  }
  history.push({ role: "user", content: text });
  if (history.length > 24) history = history.slice(-24);
  while (history.length && history[0].role !== "user") history.shift();

  let reply = "";
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "content-type": "application/json"
      },
      body: JSON.stringify({ model: CONFIG.model, max_tokens: 400, system: buildSystem(), messages: history })
    });
    if (!res.ok) {
      let detail = "";
      try { const j = await res.json(); detail = (j && j.error && j.error.message) || ""; } catch (e) {}
      history.pop();
      console.warn("Erro da API", res.status, detail);
      showStatus("ERRO " + res.status + (detail ? " · " + detail : ""), true, 10000);
      const msg = (res.status === 401 || res.status === 403)
        ? "A chave da API foi recusada, " + CONFIG.address + ". Verifica se a colaste bem."
        : "O servidor devolveu um erro " + res.status + ". Verifica a tua chave da API e tenta outra vez.";
      await say(msg);
      return;
    }
    const data = await res.json();
    reply = (data && Array.isArray(data.content) ? data.content.filter(b => b.type === "text").map(b => b.text).join("\n") : "").trim();
  } catch (e) {
    history.pop();
    console.warn(e);
    showStatus("SEM LIGAÇÃO AO SERVIDOR", true, 8000);
    await say("Não consegui ligar ao servidor, " + CONFIG.address + ". Verifica a ligação à internet.");
    return;
  }
  if (!reply) reply = "Fiquei sem resposta desta vez. Podes repetir?";
  const clean = applySaves(reply) || "Fica guardado, " + CONFIG.address + ".";
  history.push({ role: "assistant", content: clean });
  await say(clean);
}

/* ===================== MEMÓRIA VIVA ===================== */
const SAVE_RE = /\[\[SAVE:([a-z_]+)\|([^|]+)\|([\s\S]+?)\]\]/;
function applySaves(text) {
  const re = new RegExp(SAVE_RE.source, "g");
  const flashIds = [];
  for (const m of text.matchAll(re)) {
    const id = upsertNote(m[1], m[2].trim(), m[3].trim());
    if (id) flashIds.push(id);
  }
  const out = text.replace(re, "").replace(/\[\[SAVE[\s\S]*$/, "").replace(/[*#`]/g, "").trim();
  if (flashIds.length) {
    saveNotes();
    renderGraph();
    flashIds.forEach(flashNode);
  }
  return out;
}
function makeId(title) {
  return (norm(title).replace(/ /g, "-") || "nota") + "-" + Date.now().toString(36);
}
function upsertNote(area, title, body) {
  if (!AREA[area]) area = "meta";
  title = title.slice(0, 40);
  const ex = notes.find(n => norm(n.title) === norm(title));
  if (ex) { ex.area = area; ex.body = body; return ex.id; }
  const id = makeId(title);
  notes.push({ id, area, title, body });
  return id;
}

/* ===================== SECOND BRAIN: GRAFO ===================== */
const graphEl = $("#graph");
let geom = [], pulses = [];
const W = 1000, H = 540, CX = 500, CY = 262, RX = 410, RY = 196;

function renderGraph() {
  const order = Object.keys(AREA);
  const list = [...notes].sort((a, b) => order.indexOf(a.area) - order.indexOf(b.area));
  const ids = new Set(list.map(n => n.id));

  // Arestas: relações fixas + ligação automática para notas novas sem ligações
  const seen = new Set(), edges = [];
  const add = (a, b) => {
    if (a === b || !ids.has(a) || !ids.has(b)) return;
    const k = a < b ? a + "|" + b : b + "|" + a;
    if (seen.has(k)) return;
    seen.add(k); edges.push([a, b]);
  };
  REL.forEach(([a, b]) => add(a, b));
  for (const n of list) {
    if (edges.some(e => e[0] === n.id || e[1] === n.id)) continue;
    const same = list.find(o => o.id !== n.id && o.area === n.area);
    const hub = list.find(o => o.id !== n.id && o.area === "metas") || list.find(o => o.id !== n.id && o.area === "meta");
    if (same) add(n.id, same.id);
    if (hub) add(n.id, hub.id);
  }
  const degree = {};
  edges.forEach(([a, b]) => { degree[a] = (degree[a] || 0) + 1; degree[b] = (degree[b] || 0) + 1; });

  // Posições em elipse
  const pos = {};
  list.forEach((n, i) => {
    const ang = -Math.PI / 2 + (i / list.length) * Math.PI * 2;
    pos[n.id] = { x: CX + RX * Math.cos(ang), y: CY + RY * Math.sin(ang), r: Math.min(26, 9 + (degree[n.id] || 0) * 1.6) };
  });

  geom = edges.map(([a, b]) => {
    const A = pos[a], B = pos[b];
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    return { ax: A.x, ay: A.y, bx: B.x, by: B.y, cx: mx + (CX - mx) * 0.35, cy: my + (CY - my) * 0.35 };
  });

  let s = '<defs>' +
    '<radialGradient id="coreGrad" cx="50%" cy="45%" r="60%"><stop offset="0%" stop-color="#f3e8ff"/><stop offset="45%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#3b0764"/></radialGradient>' +
    '<linearGradient id="edgeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="' + W + '" y2="' + H + '"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>' +
    '<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '<filter id="softglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '</defs>';

  // Raios núcleo → nó
  for (const n of list) {
    const p = pos[n.id];
    s += '<line x1="' + CX + '" y1="' + CY + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '" stroke="' + AREA[n.area].color + '" stroke-opacity=".22" stroke-width="1"/>';
  }
  // Teia de arestas
  geom.forEach((g, i) => {
    const d = "M" + g.ax.toFixed(1) + " " + g.ay.toFixed(1) + " Q" + g.cx.toFixed(1) + " " + g.cy.toFixed(1) + " " + g.bx.toFixed(1) + " " + g.by.toFixed(1);
    s += '<path d="' + d + '" fill="none" stroke="url(#edgeGrad)" stroke-opacity=".2" stroke-width="1.2"/>';
    s += '<path class="edge-flow" d="' + d + '" fill="none" stroke="url(#edgeGrad)" stroke-opacity=".75" stroke-width="1.4" style="animation-delay:-' + ((i * 0.41) % 3).toFixed(2) + 's"/>';
  });
  // Núcleo
  s += '<circle class="breath" cx="' + CX + '" cy="' + CY + '" r="62" fill="none" stroke="#a78bfa" stroke-width="1.5"/>' +
    '<g class="core-g"><circle cx="' + CX + '" cy="' + CY + '" r="46" fill="url(#coreGrad)" filter="url(#glow)"/>' +
    '<text x="' + CX + '" y="' + CY + '" dy=".35em" text-anchor="middle" font-size="40">🧠</text></g>';
  // Nós
  list.forEach((n, i) => {
    const p = pos[n.id], c = AREA[n.area].color, x = p.x.toFixed(1), y = p.y.toFixed(1);
    s += '<g class="node" data-id="' + esc(n.id) + '" id="n-' + esc(n.id) + '">' +
      '<title>' + esc(n.title + ": " + n.body) + '</title>' +
      '<circle cx="' + x + '" cy="' + y + '" r="' + (p.r + 14) + '" fill="transparent"/>' +
      '<circle class="breath" cx="' + x + '" cy="' + y + '" r="' + (p.r + 7) + '" fill="none" stroke="' + c + '" stroke-width="1.5" style="animation-delay:-' + ((i * 0.37) % 3.6).toFixed(2) + 's"/>' +
      '<circle class="nbody" cx="' + x + '" cy="' + y + '" r="' + p.r + '" fill="' + c + '" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".35" stroke-width="1" filter="url(#softglow)"/>' +
      '<circle cx="' + x + '" cy="' + y + '" r="' + (p.r * 0.36).toFixed(1) + '" fill="#ffffff" fill-opacity=".5"/>' +
      '<text x="' + x + '" y="' + (p.y + p.r + 18).toFixed(1) + '" text-anchor="middle" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#d9f4ff" stroke="#03070d" stroke-width="4" stroke-linejoin="round" paint-order="stroke">' + esc(n.title) + '</text>' +
      '</g>';
  });
  // Pulsos de sinapse
  s += '<g id="pulses">';
  for (let i = 0; i < 12; i++) s += '<circle r="3.2" fill="#ffffff" filter="url(#softglow)" opacity="0"/>';
  s += '</g>';

  // IMPORTANTE: innerHTML na DIV contentora (nunca no <svg>) para o namespace SVG ficar correto em Safari/webviews
  graphEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" preserveAspectRatio="xMidYMid meet">' + s + '</svg>';

  pulses = Array.from(graphEl.querySelectorAll("#pulses circle")).map(el => resetPulse({ el }, true));
  if (graphEl.scrollWidth > graphEl.clientWidth) graphEl.scrollLeft = (graphEl.scrollWidth - graphEl.clientWidth) / 2;

  // Contador e legenda
  const areas = order.filter(k => notes.some(n => n.area === k));
  $("#counter").textContent = notes.length + (notes.length === 1 ? " nota" : " notas") + " · " + areas.length + (areas.length === 1 ? " área" : " áreas");
  $("#legendItems").innerHTML = areas.map(k =>
    '<span class="it"><span class="dot" style="background:' + AREA[k].color + ';box-shadow:0 0 8px ' + AREA[k].color + '"></span>' + esc(AREA[k].label) + '</span>').join("");
}

function resetPulse(p, first) {
  p.e = geom.length ? Math.floor(Math.random() * geom.length) : -1;
  p.t = first ? Math.random() : 0;
  p.speed = 0.25 + Math.random() * 0.35;
  p.rev = Math.random() < 0.5;
  return p;
}
let lastTs = 0;
function tick(ts) {
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
  lastTs = ts;
  for (const p of pulses) {
    const g = geom[p.e];
    if (!g) { p.el.setAttribute("opacity", "0"); if (geom.length) resetPulse(p); continue; }
    p.t += p.speed * dt;
    if (p.t >= 1) { resetPulse(p); continue; }
    const t = p.rev ? 1 - p.t : p.t, u = 1 - t;
    const x = u * u * g.ax + 2 * u * t * g.cx + t * t * g.bx;
    const y = u * u * g.ay + 2 * u * t * g.cy + t * t * g.by;
    p.el.setAttribute("cx", x.toFixed(1));
    p.el.setAttribute("cy", y.toFixed(1));
    p.el.setAttribute("opacity", Math.sin(Math.PI * p.t).toFixed(2));
  }
  requestAnimationFrame(tick);
}

function flashNode(id) {
  const el = graphEl.querySelector('[id="n-' + CSS.escape(id) + '"]');
  if (!el) return;
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 3000);
}

/* ===================== EDITOR DE NOTAS ===================== */
let editingId = null;
$("#fArea").innerHTML = Object.keys(AREA).map(k => '<option value="' + k + '">' + esc(AREA[k].label) + '</option>').join("");

function openEditor(id) {
  const n = id ? notes.find(x => x.id === id) : null;
  editingId = n ? n.id : null;
  $("#modalTitle").textContent = n ? "EDITAR NOTA" : "NOVA NOTA";
  $("#fTitle").value = n ? n.title : "";
  $("#fArea").value = n ? n.area : "metas";
  $("#fBody").value = n ? n.body : "";
  $("#fDelete").style.display = n ? "" : "none";
  $("#modal").classList.add("open");
  setTimeout(() => $("#fTitle").focus(), 50);
}
function closeEditor() { $("#modal").classList.remove("open"); editingId = null; }

$("#fSave").addEventListener("click", () => {
  const title = $("#fTitle").value.trim(), area = $("#fArea").value, body = $("#fBody").value.trim();
  if (!title) { $("#fTitle").focus(); return; }
  let id = editingId;
  if (id) {
    const n = notes.find(x => x.id === id);
    if (n) { n.title = title; n.area = area; n.body = body; }
  } else {
    id = makeId(title);
    notes.push({ id, area, title, body });
  }
  saveNotes(); closeEditor(); renderGraph(); flashNode(id);
});
$("#fDelete").addEventListener("click", () => {
  if (!editingId) return;
  notes = notes.filter(x => x.id !== editingId);
  saveNotes(); closeEditor(); renderGraph();
});
$("#fCancel").addEventListener("click", closeEditor);
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeEditor(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeEditor(); });

graphEl.addEventListener("click", e => {
  const node = e.target.closest && e.target.closest(".node");
  if (node) openEditor(node.getAttribute("data-id"));
});
$("#addBtn").addEventListener("click", () => openEditor(null));
$("#reloadBtn").addEventListener("click", () => { notes = loadNotes(); renderGraph(); });

/* ===================== CONTROLOS ===================== */
$("#textInput").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const t = e.target.value.trim();
  if (!t) return;
  if (busy && uiState === "thinking") return;
  if (window.speechSynthesis) speechSynthesis.cancel();
  e.target.value = "";
  processCommand(t);
});
$("#stopBtn").addEventListener("click", () => { if (window.speechSynthesis) speechSynthesis.cancel(); });
$("#micBtn").addEventListener("click", () => {
  if (!SR) { showStatus("VOZ INDISPONÍVEL NESTE NAVEGADOR · USA O CHROME", true, 6000); return; }
  if (wantListening) { stopListening(); setState("idle"); return; }
  wantListening = true; updateMic();
  activeUntil = Date.now() + CONV_MS;
  safeStart();
});
$("#orb").addEventListener("click", () => {
  if (uiState === "speaking") { speechSynthesis.cancel(); return; }
  if (!SR) { showStatus("VOZ INDISPONÍVEL NESTE NAVEGADOR · ESCREVE ABAIXO", true, 6000); return; }
  wantListening = true; updateMic();
  activeUntil = Date.now() + CONV_MS;
  safeStart();
  setState(idleState());
});

/* ===================== ARRANQUE ===================== */
renderGraph();
requestAnimationFrame(tick);

setTimeout(() => {
  $("#boot").classList.add("hide");
  $("#activate").classList.remove("hide");
}, 2200);

$("#btnActivate").addEventListener("click", () => {
  $("#activate").classList.add("hide");
  $("#app").classList.add("show");
  setTimeout(() => { $("#boot").style.display = "none"; $("#activate").style.display = "none"; }, 900);
  // Este clique é o gesto que liberta microfone e áudio
  if (SR) { wantListening = true; updateMic(); safeStart(); }
  say("Sistemas online. Estou a ouvir, " + CONFIG.address + ".");
});
